<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네 번의 금기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0E0C0A; --ink-2:#1A1612; --paper:#E8DFCB; --paper-dim:#B8AD98; --mute:#857A69; --line:#3A3229;
    --red:#B5352B; --red-soft:#D8564A; --serpent:#4F8A6E; --gold:#D3A94A; --gold-soft:#F0D48A; --night:#1B2233;
    --display:"Song Myung","Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --body:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",Georgia,serif;
    --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--paper);height:100%;overflow:hidden}
  body{font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none}
  button{font-family:inherit}

  /* ---------- stage / frame ---------- */
  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .frame{position:relative;width:var(--fw);height:var(--fh);font-size:calc(var(--fw) / 100);overflow:hidden;background:var(--ink)}
  .cam{position:absolute;inset:0;will-change:transform}
  canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
  #chars{position:absolute;inset:0;pointer-events:none}
  .ch{
    position:absolute;bottom:-2%;width:26%;height:84%;transform:translateX(-50%);
    color:#070605;transition:opacity .7s ease,transform .7s ease,filter .5s ease;
    opacity:0;filter:drop-shadow(0 0 .6em rgba(232,223,203,.16));
  }
  .ch svg{width:100%;height:100%;display:block;overflow:visible}
  .ch.on{opacity:1}
  .ch.idle svg{animation:breathe 4.6s ease-in-out infinite}
  .ch.speak{filter:drop-shadow(0 0 1.6em var(--rim)) drop-shadow(0 0 .3em var(--rim));transform:translateX(-50%) scale(1.03)}
  .ch.dim{opacity:.72}
  .ch.blue{--rim:#7FB3E6}
  .ch.fire{filter:drop-shadow(0 0 1.4em #FF8A2A) drop-shadow(0 .6em 2em #C93A18);animation:flicker .25s steps(2) infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6%)}}
  @keyframes flicker{50%{filter:drop-shadow(0 0 1.9em #FFB25A) drop-shadow(0 .6em 2.4em #C93A18)}}
  .ch.pos-left{left:20%} .ch.pos-center{left:50%} .ch.pos-right{left:80%} .ch.pos-tree{left:76%;bottom:34%;width:15%;height:46%}

  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
  #fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease;pointer-events:none}
  #fade.on{opacity:1}
  #flash{position:absolute;inset:0;background:#FFF3DA;opacity:0;pointer-events:none}
  #flash.go{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .cam.shake{animation:shake .5s linear}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-.6%,.3%)}40%{transform:translate(.5%,-.4%)}60%{transform:translate(-.4%,.2%)}80%{transform:translate(.3%,.3%)}}
  .bars{position:absolute;left:0;right:0;height:0;background:#000;transition:height .9s ease;z-index:6;pointer-events:none}
  .bars.top{top:0}.bars.bottom{bottom:0}
  .bars.on{height:11%}

  /* ---------- dialogue ---------- */
  #dlg{
    position:absolute;left:5%;right:5%;bottom:4%;height:24%;z-index:5;
    background:linear-gradient(180deg,rgba(26,22,18,.94),rgba(14,12,10,.97));
    border:1px solid rgba(211,169,74,.35);border-radius:.3em;
    padding:2.6em 2.6em 1.6em;cursor:pointer;opacity:0;transition:opacity .35s;
    box-shadow:0 1em 3em rgba(0,0,0,.6), inset 0 0 0 1px rgba(232,223,203,.04);
  }
  #dlg.on{opacity:1}
  #dlg::before{content:"";position:absolute;inset:.45em;border:1px solid rgba(232,223,203,.08);border-radius:.15em;pointer-events:none}
  #name{
    position:absolute;top:-1.35em;left:2.2em;font-family:var(--display);font-size:1.45em;letter-spacing:.12em;
    padding:.25em 1em .2em;background:var(--ink);border:1px solid var(--who,var(--paper-dim));color:var(--who,var(--paper));
    border-radius:.15em;
  }
  #name:empty{display:none}
  #text{font-size:1.75em;line-height:1.75;color:var(--paper);text-wrap:pretty;max-width:60ch}
  #text.narr{font-style:normal;color:var(--paper-dim)}
  #text.q{font-family:var(--display);color:var(--red-soft)}
  #text.q.serp{color:#8FC7A9}
  #text .cur{display:inline-block;width:.5em;height:1em;background:var(--paper-dim);vertical-align:-.15em;margin-left:.1em;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #adv{position:absolute;right:2em;bottom:1em;font-family:var(--ui);font-size:1.1em;color:var(--gold);opacity:0;animation:bob 1.2s ease-in-out infinite}
  #adv.on{opacity:1}
  @keyframes bob{50%{transform:translateY(.3em)}}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:2.2%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
  .taboos{display:flex;gap:.5em;pointer-events:auto}
  .tb{
    width:3.2em;height:3.2em;border:1px solid var(--line);border-radius:.2em;display:grid;place-items:center;
    font-family:var(--display);font-size:1.15em;color:var(--mute);background:rgba(14,12,10,.7);transition:all .5s;
  }
  .tb.kept{color:var(--paper-dim);border-color:var(--paper-dim)}
  .tb.broken{color:var(--paper);border-color:var(--red);background:var(--red);box-shadow:0 0 1em rgba(181,53,43,.6)}
  #role{font-family:var(--ui);font-size:1.05em;letter-spacing:.2em;color:var(--mute);margin-left:1em;align-self:center}
  .tools{display:flex;gap:.5em;pointer-events:auto}
  .tool{
    font-family:var(--ui);font-size:1.05em;letter-spacing:.08em;color:var(--paper-dim);background:rgba(14,12,10,.7);
    border:1px solid var(--line);border-radius:.2em;padding:.45em .9em;cursor:pointer;
  }
  .tool:hover{color:var(--paper);border-color:var(--paper-dim)}
  .tool[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
  .tools{position:relative;flex-direction:column;align-items:flex-end}
  .gear{width:3.2em;height:3.2em;padding:0;display:grid;place-items:center;border-radius:50%}
  .gear[aria-expanded="true"]{color:var(--gold);border-color:var(--gold)}
  .gear svg{transition:transform .5s ease}
  .gear[aria-expanded="true"] svg{transform:rotate(60deg)}
  .menu-dd{margin-top:.5em;display:flex;flex-direction:column;gap:.35em;min-width:12em;padding:.5em;background:rgba(14,12,10,.92);border:1px solid var(--line);border-radius:.25em;box-shadow:0 .8em 2em rgba(0,0,0,.6);animation:rise .18s ease both}
  .menu-dd[hidden]{display:none}
  .menu-dd .tool{background:transparent;border-color:transparent;display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.5em .8em}
  .menu-dd .tool:hover{border-color:var(--line);background:rgba(232,223,203,.05)}
  .menu-dd .tool i{width:.6em;height:.6em;border-radius:50%;border:1px solid var(--mute)}
  .menu-dd .tool[aria-pressed="true"] i{background:var(--gold);border-color:var(--gold)}
  .tool:focus-visible,.choice:focus-visible,.big:focus-visible,.mtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- overlays ---------- */
  .ov{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(6,5,4,.55);padding:4%}
  .ov[hidden]{display:none}
  .choices{display:flex;flex-direction:column;gap:.9em;width:min(64%,56em)}
  .choice{
    font-family:var(--body);font-size:1.7em;color:var(--paper);text-align:left;
    background:rgba(26,22,18,.96);border:1px solid rgba(211,169,74,.35);border-radius:.15em;
    padding:.7em 1.1em;cursor:pointer;display:grid;gap:.1em;transition:all .2s;box-shadow:0 .6em 2em rgba(0,0,0,.5);
  }
  .choice:hover{border-color:var(--paper-dim);background:#2A241D;transform:translateX(.3em)}
  .choice small{font-family:var(--ui);font-size:.62em;color:var(--mute);letter-spacing:.06em}
  .choice.break:hover{border-color:var(--red)} .choice.break small{color:var(--red-soft)}
  .panel{
    background:rgba(26,22,18,.97);border:1px solid rgba(211,169,74,.35);border-radius:.2em;padding:2em 2.6em;
    width:min(72%,68em);max-height:100%;overflow:auto;box-shadow:0 1em 3em rgba(0,0,0,.6);
  }
  .panel h3{font-family:var(--display);font-weight:400;font-size:2.4em;margin:0 0 .3em;line-height:1.2}
  .panel h4{font-family:var(--ui);font-size:1em;letter-spacing:.2em;color:var(--mute);font-weight:500;margin:1.6em 0 .5em}
  .panel p{font-size:1.3em;line-height:1.7;margin:0 0 .7em}
  .panel a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line)}
  .big{font-family:var(--ui);font-size:1.25em;letter-spacing:.1em;color:var(--ink);background:var(--paper);border:0;border-radius:.15em;padding:.7em 1.6em;cursor:pointer}
  .big:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:.8em;flex-wrap:wrap;margin-top:1.4em}

  /* title */
  #title{background:transparent;align-items:end;justify-items:start;padding:6% 8%}
  #title .t{display:grid;gap:.4em}
  #title .eyebrow{font-family:var(--ui);font-size:1.1em;letter-spacing:.32em;color:var(--paper-dim)}
  #title h1{font-family:var(--display);font-weight:400;font-size:7.5em;line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 .1em 1em rgba(0,0,0,.8)}
  #title h1 b{font-weight:400;color:var(--red-soft)}
  #title .sub{font-size:1.5em;color:var(--paper-dim);margin-bottom:1em}
  #title .menu{display:flex;gap:.8em;flex-wrap:wrap}
  #title .foot{position:absolute;right:4%;bottom:5%;font-family:var(--ui);font-size:1em;color:var(--mute);letter-spacing:.1em;text-align:right;line-height:1.7}

  /* bead */
  .bead{display:grid;grid-template-columns:14em 1fr;gap:2em;align-items:center}
  .bead svg{width:14em;height:14em}
  .facet{fill:#2A241D;stroke:var(--line);stroke-width:1;transition:fill .6s,stroke .6s}
  .facet.on{fill:var(--gold);stroke:var(--gold-soft);filter:drop-shadow(0 0 .3em var(--gold))}
  .facet.missing{fill:transparent;stroke:var(--gold);stroke-dasharray:3 3}
  .facet.hid{fill:var(--ink);stroke:var(--serpent)}
  .facets{list-style:none;margin:0;padding:0;font-family:var(--ui);font-size:1.2em;line-height:1.8;color:var(--paper-dim)}
  .facets li{display:grid;grid-template-columns:1.6em 1fr;gap:.6em;opacity:0;animation:rise .5s ease both}
  .facets li b{color:var(--gold);font-weight:500}
  .facets li.miss{color:var(--mute)} .facets li.miss b{color:var(--mute)}
  @keyframes rise{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}

  /* map */
  .map{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em;margin:1em 0 1.4em}
  .mtn{border:1px solid var(--line);border-radius:.15em;background:rgba(14,12,10,.8);color:var(--paper-dim);padding:1em .5em .8em;cursor:pointer;display:grid;gap:.1em;justify-items:center;font-family:var(--display);font-size:1.5em;transition:all .4s}
  .mtn small{font-family:var(--ui);font-size:.6em;letter-spacing:.08em;color:var(--mute)}
  .mtn:hover:not(:disabled){border-color:var(--paper-dim)}
  .mtn.lit{background:var(--gold);color:var(--ink);border-color:var(--gold-soft);box-shadow:0 0 1.2em rgba(211,169,74,.6)} .mtn.lit small{color:var(--ink)}
  .mtn:disabled{cursor:default} .mtn.dead{opacity:.3}
  .meter{font-family:var(--ui);font-size:1.2em;color:var(--mute);display:flex;justify-content:space-between} .meter b{color:var(--gold);font-weight:500}

  /* ending */
  .end-tag{font-family:var(--ui);font-size:1.1em;letter-spacing:.3em;color:var(--red-soft);margin:0 0 .6em} .end-tag.true{color:var(--gold)}
  .end-name{font-family:var(--display);font-size:4.2em;line-height:1.1;margin:0 0 .25em}
  .cond{font-family:var(--ui);font-size:1.15em;color:var(--mute);border:1px solid var(--line);padding:.9em 1.1em;line-height:1.7;margin:1.2em 0} .cond b{color:var(--paper-dim);font-weight:500}
  .codex{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:1.2em 0}
  .codex div{border:1px solid var(--line);padding:.7em .9em;font-family:var(--ui);font-size:1em;color:var(--mute);display:grid;gap:.1em}
  .codex div span{font-family:var(--display);font-size:1.4em;color:var(--paper-dim)}
  .codex .got{border-color:var(--paper-dim)} .codex .got span{color:var(--paper)}
  .codex .got.true{border-color:var(--gold)} .codex .got.true span{color:var(--gold)}

  /* log */
  .log{font-size:1.3em;line-height:1.7;display:grid;gap:.5em}
  .log div b{font-family:var(--display);font-weight:400;color:var(--gold);margin-right:.6em}
  .log div.narr{color:var(--paper-dim)}

  /* cinematic */
  #cine{position:absolute;inset:0;z-index:7;display:none}
  #cine.on{display:block}
  #sub{position:absolute;left:8%;right:8%;bottom:2.4%;z-index:7;text-align:center;font-family:var(--display);font-size:2.3em;line-height:1.5;color:var(--paper);text-shadow:0 .1em 1em #000,0 0 .3em #000;opacity:0;transition:opacity .5s;pointer-events:none}
  #sub.on{opacity:1}
  #cineTitle{position:absolute;inset:0;z-index:7;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #cineTitle.on{opacity:1}
  #cineTitle h2{font-family:var(--display);font-weight:400;font-size:6em;margin:0;letter-spacing:.2em;color:var(--paper)}
  #cineTitle p{font-family:var(--ui);font-size:1.2em;letter-spacing:.4em;color:var(--paper-dim);margin:.6em 0 0}
  #skip{position:absolute;right:3%;top:13%;z-index:9;display:none}
  #skip.on{display:block}

  #ttsNote{position:absolute;left:3%;bottom:2%;z-index:9;font-family:var(--ui);font-size:.95em;color:var(--mute);letter-spacing:.06em;display:none}

  @media (prefers-reduced-motion:reduce){ .ch.idle svg,#adv,.ch.fire{animation:none} }
</style>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="cam" id="cam">
      <canvas class="layer" id="bg"></canvas>
      <div id="chars"></div>
      <div id="vig"></div>
      <canvas class="layer" id="grain"></canvas>
      <canvas class="layer" id="cine"></canvas>
    </div>
    <div id="flash"></div>
    <div id="fade" class="on"></div>
    <div class="bars top" id="barT"></div><div class="bars bottom" id="barB"></div>
    <div id="cineTitle"><div><h2 id="cineH">산천굿</h2><p id="cineP">山川굿 · 함흥 망묵굿</p></div></div>
    <div id="sub"></div>
    <button class="tool" id="skip">건너뛰기 ⏭</button>

    <div id="hud">
      <div></div>
      <div class="tools">
        <button class="tool gear" id="btnGear" aria-expanded="false" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" width="1.4em" height="1.4em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu-dd" id="menu" hidden>
          <button class="tool" id="btnAuto" aria-pressed="false"><span>자동 진행</span><i></i></button>
          <button class="tool" id="btnSound" aria-pressed="true"><span>소리</span><i></i></button>
          <button class="tool" id="btnLog"><span>기록</span></button>
          <button class="tool" id="btnLore"><span>원전과 해석</span></button>
          <button class="tool" id="btnHome"><span>처음으로</span></button>
        </div>
      </div>
    </div>

    <div id="dlg"><div id="name"></div><div id="text"></div><div id="adv">▼</div></div>

    <div class="ov" id="choiceOv" hidden><div class="choices" id="choices"></div></div>
    <div class="ov" id="panelOv" hidden><div class="panel" id="panel"></div></div>

    <div class="ov" id="title">
      <div class="t">
        <div class="eyebrow">함경도 망묵굿 · 산천굿 사설 · 인터랙티브 픽션</div>
        <h1>네 번의 <b>금기</b></h1>
        <div class="sub">붉은선비와 영산각시</div>
        <div class="menu">
          <button class="big" id="btnStart">시작하기</button>
          <button class="tool" id="btnCodex">결말 도감</button>
          <button class="tool" id="btnLore2">원전과 해석</button>
        </div>
      </div>
      <div class="foot">설화문학론 · 설화의 콘텐츠 재생산<br>클릭 / Space 로 진행 · 소리를 켜고 플레이하세요</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const n1=(x,s=0)=>(Math.sin(x*1.7+s)+Math.sin(x*3.1+s*2.3)*.5+Math.sin(x*6.7+s*4.1)*.25)/1.75;
function rng(seed){ let s=seed>>>0||1; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }

/* ================= frame sizing ================= */
const frame=$('#frame');
let FW=1280, FH=720;
function fit(){
  const vw=innerWidth, vh=innerHeight;
  let w=vw, h=vw*9/16; if(h>vh){h=vh; w=vh*16/9;}
  FW=Math.floor(w); FH=Math.floor(h);
  frame.style.setProperty('--fw',FW+'px'); frame.style.setProperty('--fh',FH+'px');
  [bgC,grainC,cineC].forEach(c=>{ const d=Math.min(devicePixelRatio||1,2); c.width=Math.round(FW*d); c.height=Math.round(FH*d); c.getContext('2d').setTransform(d,0,0,d,0,0); });
  drawGrain();
}
const bgC=$('#bg'), grainC=$('#grain'), cineC=$('#cine');
const bg=bgC.getContext('2d'), cine=cineC.getContext('2d');
addEventListener('resize',fit);

function drawGrain(){
  const g=grainC.getContext('2d'); const w=grainC.width, h=grainC.height;
  const img=g.createImageData(w,h); const d=img.data; const r=rng(7);
  for(let i=0;i<d.length;i+=4){ const v=(r()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  g.setTransform(1,0,0,1,0,0); g.putImageData(img,0,0);
}

/* ================= state ================= */
const KEYS=['water','fruit','rain','fire'];
let S=fresh();
function fresh(){ return {broken:[],kept:[],role:'붉은선비',mtn:[],ash:0,pyre:0,ending:null,label:'prologue',i:0}; }
let codex=[]; try{codex=JSON.parse(localStorage.getItem('sancheon-codex')||'[]');}catch(e){}
function saveCodex(){ try{localStorage.setItem('sancheon-codex',JSON.stringify(codex));}catch(e){} }
const log=[];

/* ================= audio ================= */
const AU={ ctx:null, on:true, master:null, amb:null, ambGain:null, drumTimer:null, nextBar:0, drumOn:false };
function audio(){
  if(AU.ctx) return AU.ctx;
  try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }

const dlg=$('#dlg'), nameEl=$('#name'), textEl=$('#text'), adv=$('#adv');
let typing=null, waiting=null, autoMode=false, autoTimer=null;
function say(who,text,opts={}){ return new Promise(res=>{
  const c=CH[who]||CH.narr; dlg.classList.add('on'); nameEl.textContent=c.name; nameEl.style.setProperty('--who',c.color);
  textEl.className=(who==='narr'?'narr':'')+(opts.q?' q':'')+(opts.serp?' serp':''); textEl.innerHTML='';
  adv.classList.remove('on'); speakChar(who==='narr'?null:who);
  log.push({who:c.name,t:text,narr:who==='narr'});
  const chars=[...text]; let i=0; const cur=document.createElement('span'); cur.className='cur'; textEl.appendChild(cur);
  const speed=reduce?0:(opts.q?42:26);
  function finish(){ clearInterval(typing); typing=null; cur.remove(); textEl.textContent=text; adv.classList.add('on'); waiting=()=>{ waiting=null; res(); }; if(autoMode){ autoTimer=setTimeout(()=>{ if(waiting) waiting(); }, 900+text.length*55); } }
  if(speed===0){ finish(); return; }
  typing=setInterval(()=>{ if(i>=chars.length){ finish(); return; } cur.insertAdjacentText('beforebegin',chars[i]); if(i%3===0&&!opts.q) SFX.tick(); i++; }, speed);
  waiting=()=>{ if(typing){ finish(); } };
});}
function advance(){ if($('#choiceOv').hidden===false||$('#panelOv').hidden===false||!$('#title').hidden||GUT.playing) return; if(waiting){ clearTimeout(autoTimer); waiting(); } }
dlg.addEventListener('click',advance);
$('#cam').addEventListener('click',advance);
document.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); advance(); } if(e.key==='Escape'){ if(GUT.playing) GUT.skip(); else closePanel(); } });

  ov.hidden=false; box.querySelector('button').focus(); }); }

const ENDINGS={
  origin:{name:'산천굿의 기원',tag:'참된 결말',trueEnd:true,cond:'네 금기를 모두 어기고, 각시가 대신 가서, 칼을 꺼내고, 마지막 모를 던지고, 팔도에 재를 다 뿌린다.',text:['붉은선비의 병이 나았다. 그 뒤로 산천 동티가 나면 사람들은 팔도 명산에 소반을 차리고 산천굿을 했다.','함흥의 망묵굿에서 무당은 장구 하나로 이 이야기를 부른다. 네 금기를 모두 어긴 선비, 칼을 품고 나선 각시, 재로 지어진 산천.','금기를 하나라도 지켰다면 이 산천은 없었다. 이야기는 위반을 먹고 자란다.']},
  half:{name:'반쪽 산천',tag:'모자란 결말',cond:'금기를 한 개에서 세 개까지만 어긴다. 재가 팔도에 미치지 못한다.',text:['붉은선비의 병은 더디 나았다. 신령이 앉지 못한 산에는 빌 곳이 없었다.','영산각시는 빈 소반을 앞에 두고 오래 앉아 있었다. 어긴 금기가 적었던 만큼 대망신이 작았고, 재가 모자랐다.','이야기는 굿이 되기에 조금 모자랐다. 다시 산을 내려가 보라.']},
  quiet:{name:'아무 일 없는 산천',tag:'이야기가 되지 못한 결말',cond:'네 금기를 모두 지킨다.',text:['붉은선비는 무사히 집에 닿았다. 영산각시가 마중을 나왔고, 두 사람은 오래 살았다.','대망신은 제 물과 과실과 비와 불을 온전히 먹고 천 년을 채워 승천했다. 팔도의 산에는 아무도 앉지 않았다.','아무도 산천굿을 알지 못한다. 금기를 다 지킨 이야기는 이야기가 되지 못했다.']},
  eaten:{name:'선비의 최후',tag:'끝난 결말',cond:'붉은선비가 대망신 앞에서 눈을 감거나, 각시 대신 다시 나무로 돌아간다.',text:['대망신은 약속대로 했다. 나무 아래에는 도복 한 벌이 남았다.','영산각시는 그 도복을 개어 품에 안고 돌아왔다. 속새칼은 끝내 품에서 꺼내지 않았다.','대망신은 이튿날 승천했다. 이야기는 여기서 끊긴다.']},
  clan:{name:'구족의 결말',tag:'가장 무거운 결말',cond:'정해진 시각에 아무도 나무로 가지 않는다.',text:['정해진 시각이 지났다. 대망신은 나무에서 내려와 마을로 향했다.','「정해진 시각까지 돌아오지 않으면 구족을 멸하겠다」는 말은 빈말이 아니었다.','금기를 어긴 값을 한 사람이 치르지 않으면 아홉 겹의 친족이 치른다. 무가는 그렇게 셈한다.']},
  seven:{name:'일곱 모',tag:'풍요로운 결말',cond:'각시가 일곱 모의 야광주로 만족하고 돌아선다.',text:['영산각시는 일곱 모의 야광주로 평생을 쓰고 입고 놀고 먹었다. 없던 집이 나고, 없던 금전이 나고, 없던 사람이 났다.','낭군만 없었다. 대망신은 이튿날 승천했다.','여덟째 모가 무엇이었는지 각시는 끝내 알지 못했다. 그 모를 물어보려면 칼이 있어야 했다.']}
};
const ORDER=['origin','half','quiet','eaten','clan','seven'];
function codexHTML(){ return `<div class="codex">${ORDER.map(k=>{ const got=codex.includes(k); return `<div class="${got?'got':''} ${ENDINGS[k].trueEnd?'true':''}"><span>${got?ENDINGS[k].name:'？'}</span>${got?ENDINGS[k].tag:'아직 이르지 못한 결말'}</div>`; }).join('')}</div>`; }
async function ending(key){ S.ending=key; if(!codex.includes(key)){ codex.push(key); saveCodex(); } const E=ENDINGS[key];
  drumStop(); ambient(E.trueEnd?'heaven':'night'); hideAll(); dlg.classList.remove('on'); await fadeTo(true); BGS.cur=E.trueEnd?'palto':'void'; serpentLevel=0; serpentDead=false; flameOn=false; await fadeTo(false);
  await panel(`<p class="end-tag ${E.trueEnd?'true':''}">결말 · ${E.tag}</p><h2 class="end-name">${E.name}</h2>${E.text.map(t=>`<p>${t}</p>`).join('')}<div class="cond"><b>이 결말에 이르는 조건</b><br>${E.cond}</div><div class="row" style="margin-top:0"><button class="big" id="endRestart">처음부터 다시</button><button class="tool" id="endLore">원전과 해석</button><span style="align-self:center;font-family:var(--ui);font-size:1em;color:var(--mute)">결말 도감 ${codex.length} / ${ORDER.length}${E.trueEnd?'':' · 참된 결말은 하나뿐이다.'}</span></div>${codexHTML()}`);

document.addEventListener('click',e=>{ if(e.target.id==='endRestart'){ closePanel(); goTitle(); } if(e.target.id==='endLore'){ closePanel(); lore(); } if(e.target.id==='pnClose'){ closePanel(); } });
function lore(){ return panel(`<h3>원전과 해석</h3><p style="font-family:var(--ui);font-size:1em;color:var(--mute)">설화문학론 · 설화의 콘텐츠 재생산 과제 · 인터랙티브 픽션</p>
<h4>원전</h4><p>함경남도 함흥 지방 망묵굿(죽은 이를 위한 굿)의 한 거리인 <b>산천굿</b>에서 무당이 홀로 장구를 치며 부르는 무가 「붉은선비와 영산각시」. 팔도의 명산대천에 빌어 망자의 안주와 유족의 길복을 구하는 굿이며, 함흥 밖에서는 조사된 바가 없다. 이 게임은 무녀 김복순 구연본을 바탕으로 한 소개(조현설)와 사전 항목을 따랐다.</p>
<h4>원전의 뼈대</h4><p>선계에서 실수로 유배된 붉은선비와 영산각시가 부부가 된다. 붉은선비는 안혜산 금상절에서 공부한 뒤 하산하며 스승에게 네 가지 금기를 받는다 — 맑은 물을 마시지 말 것, 머루·다래·포도를 따 먹지 말 것, 폭우를 피하지 말 것, 나무 위 각시의 불을 꺼 주지 말 것. 그는 넷을 모두 어긴다. 각시는 대망신(승천을 앞둔 이무기)으로 변해 "내가 먹고 승천할 것들을 네가 먹었으니 너라도 잡아먹겠다"고 한다. 붉은선비는 오대독자를 핑계로 하직 인사를 청하고, 영산각시가 속새칼을 품고 대신 간다. 각시는 팔모야광주를 받아 내고, 칼로 위협해 마지막 모를 실토받아 대망신을 죽인다. 나뭇가지 삼천 개를 정(井) 자로 쌓아 화장한 재를 팔도에 던지자 여덟 산의 신령이 나고, 나무·돌·물에 뿌린 재는 꽃·돌·짐승이 된다. 붉은선비는 산천 동티로 앓다가 산천굿을 하고 낫는다.</p>
<h4>이 게임이 바꾼 것</h4><p>원전에서 선택은 없다. 붉은선비는 반드시 네 금기를 모두 어기고, 그래야만 대망신이 죽고 산천이 만들어진다. 게임은 그 "반드시"를 독자에게 넘긴다. 금기를 지킬수록 대망신은 작아지고, 재는 모자라고, 팔도의 산은 비어 간다. 금기를 모두 지킨 결말에는 굿이 없다. 영산각시 파트는 시점을 바꿔 두었고, 팔모야광주의 여섯째 모는 구연에서 빠져 있어 빈 모로 남겼다.</p>
<h4>굿 장면에 대하여</h4><p>마지막 산천굿은 그림자극 형식의 시네마틱으로 재현했다. 장구 굿거리 장단·징·방울은 웹오디오로 합성했고, 무가 사설 낭송은 브라우저의 한국어 음성 합성을 쓴다. 실제 무당의 구연 녹음이 아니며, 함흥 산천굿의 실제 절차를 고증한 것도 아니다. 재를 뿌려 신령이 앉은 산의 수만큼 소반에 불이 켜진다.</p>
<h4>참고</h4><p>조현설, 「자연의 금기 깬 남편 대신 해결 나선 영산 각시, 산천을 바로잡다」, 경향신문 2018-07-12 (<a href="https://www.khan.co.kr/article/201807122058005" target="_blank" rel="noopener">기사</a>) · 한국민족문화대백과사전 「산천굿」 (<a href="https://encykorea.aks.ac.kr/Article/E0026342" target="_blank" rel="noopener">항목</a>)</p><div class="row"><button class="big" id="pnClose">닫기</button></div>`); }

const GUT={playing:false,candles:0,mtnLit:0,wind:.4,ember:.2,skipFn:null,skip(){ if(GUT.skipFn) GUT.skipFn(); }};
function gutCinematic(){ return new Promise(async res=>{
  const total=S.mtn.length; GUT.playing=true; GUT.candles=0; GUT.mtnLit=0; GUT.wind=.4; GUT.ember=.2;
  hideAll(); dlg.classList.remove('on'); $('#hud').style.opacity=0; $('#skip').classList.add('on');
  $('#barT').classList.add('on'); $('#barB').classList.add('on');
  const ctx=cine; const timers=[]; let done=false; let raf=0; let t0=performance.now();
  const sub=$('#sub'); const title=$('#cineTitle');
  const wait=ms=>new Promise(r=>{ const id=setTimeout(r,ms); timers.push(id); });
  const line=(txt,ms,opts)=>{ sub.textContent=txt; sub.classList.add('on'); speak(txt,opts); return wait(ms); };
  const scene={cam:{z:1,x:0,y:0},phase:'title',spin:0,speed:1,hp:0,healed:0,flashA:0};
  function end(){ if(done) return; done=true; timers.forEach(clearTimeout); cancelAnimationFrame(raf); if(window.speechSynthesis) speechSynthesis.cancel(); drumStop(); sub.classList.remove('on'); title.classList.remove('on'); cineC.classList.remove('on'); $('#skip').classList.remove('on'); $('#barT').classList.remove('on'); $('#barB').classList.remove('on'); $('#hud').style.opacity=1; GUT.playing=false; GUT.skipFn=null; res(); }
  GUT.skipFn=async()=>{ await fadeTo(true); end(); await fadeTo(false); };
  $('#skip').onclick=GUT.skip;

  // ----- draw loop -----
  function drawMudang(x,base,sc,t,beat){
    const sp=scene.speed, sway=Math.sin(beat*Math.PI)*0.14*sp, bob=Math.abs(Math.sin(beat*Math.PI*2))*9*sc*sp;
    const spin=scene.spin, flip=Math.cos(spin);
    ctx.save(); ctx.translate(x,base-bob); ctx.rotate(sway*.3); ctx.scale(Math.max(.22,Math.abs(flip))*(flip<0?-1:1),1);
    ctx.shadowColor='rgba(216,86,74,.6)'; ctx.shadowBlur=30*sc; ctx.fillStyle='#050403'; ctx.strokeStyle='#050403'; ctx.lineCap='round';
    const flare=1+Math.abs(Math.sin(spin))*0.6+sp*.08;
    // robe
    ctx.beginPath(); ctx.moveTo(-30*sc,-240*sc); ctx.bezierCurveTo(-52*sc,-170*sc,-118*sc*flare,-70*sc,-125*sc*flare,-4*sc); ctx.quadraticCurveTo(0,10*sc*flare,125*sc*flare,-4*sc); ctx.bezierCurveTo(118*sc*flare,-70*sc,52*sc,-170*sc,30*sc,-240*sc); ctx.closePath(); ctx.fill();
    // head + 고깔
    ctx.beginPath(); ctx.arc(0,-262*sc,20*sc,0,7); ctx.fill(); ctx.beginPath(); ctx.moveTo(-27*sc,-274*sc); ctx.lineTo(0,-352*sc); ctx.lineTo(27*sc,-274*sc); ctx.closePath(); ctx.fill();
    // arms with hanging sleeves
    const arm=(side,ang,hand)=>{ const sx=side*28*sc, sy=-226*sc; const hx=sx+Math.cos(ang)*100*sc, hy=sy+Math.sin(ang)*100*sc;
      ctx.lineWidth=18*sc; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(hx,hy); ctx.stroke();
      const sa=Math.PI/2+Math.sin(beat*Math.PI*2-.9)*0.7*sp*side+sway*2; const L=120*sc+30*sc*sp; const px=Math.cos(ang+Math.PI/2)*13*sc, py=Math.sin(ang+Math.PI/2)*13*sc;
      const tx=hx+Math.cos(sa)*L, ty=hy+Math.sin(sa)*L; const wx=Math.cos(sa+Math.PI/2)*34*sc, wy=Math.sin(sa+Math.PI/2)*34*sc;
      ctx.beginPath(); ctx.moveTo(hx+px,hy+py); ctx.quadraticCurveTo(hx+px+Math.cos(sa)*L*.5+wx*.3,hy+py+Math.sin(sa)*L*.5+wy*.3,tx+wx,ty+wy); ctx.lineTo(tx-wx,ty-wy); ctx.quadraticCurveTo(hx-px+Math.cos(sa)*L*.5-wx*.3,hy-py+Math.sin(sa)*L*.5-wy*.3,hx-px,hy-py); ctx.closePath(); ctx.fill();
      if(hand==='fan'){ ctx.save(); ctx.translate(hx,hy); ctx.rotate(ang-side*.4); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,66*sc,-.6,.6); ctx.closePath(); ctx.fillStyle='rgba(181,53,43,.95)'; ctx.shadowColor='rgba(216,86,74,.8)'; ctx.fill(); ctx.strokeStyle='rgba(240,212,138,.5)'; ctx.lineWidth=1.5; for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(i*.2)*66*sc,Math.sin(i*.2)*66*sc); ctx.stroke(); } ctx.restore(); ctx.fillStyle='#050403'; ctx.strokeStyle='#050403'; }
      if(hand==='bell'){ const j=sp>1.2?Math.sin(t*40)*4*sc:0; ctx.fillStyle='#D3A94A'; ctx.shadowColor='rgba(240,212,138,.9)'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(hx+Math.cos(i*1.26)*13*sc+j,hy+Math.sin(i*1.26)*13*sc+10*sc,6*sc,0,7); ctx.fill(); } ctx.fillStyle='#050403'; ctx.shadowColor='rgba(216,86,74,.6)'; } };
    arm(1,-.9-Math.sin(beat*Math.PI*2+1)*1.0*sp,'fan'); arm(-1,Math.PI+.9+Math.sin(beat*Math.PI*2)*1.0*sp,'bell');
    ctx.restore();
  }
  function drawAksa(x,base,sc,t,hit){ ctx.save(); ctx.translate(x,base); ctx.fillStyle='#050403'; ctx.shadowColor='rgba(211,169,74,.5)'; ctx.shadowBlur=22*sc;
    ctx.beginPath(); ctx.moveTo(-70*sc,0); ctx.quadraticCurveTo(-60*sc,-120*sc,0,-150*sc); ctx.quadraticCurveTo(60*sc,-120*sc,70*sc,0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-170*sc,20*sc,0,7); ctx.fill(); ctx.beginPath(); ctx.moveTo(-24*sc,-182*sc); ctx.lineTo(0,-232*sc); ctx.lineTo(24*sc,-182*sc); ctx.closePath(); ctx.fill();
    // 장구 hourglass
    ctx.beginPath(); ctx.moveTo(-100*sc,-60*sc); ctx.lineTo(-30*sc,-60*sc); ctx.quadraticCurveTo(-8*sc,-30*sc,-30*sc,0); ctx.lineTo(-100*sc,0); ctx.quadraticCurveTo(-118*sc,-30*sc,-100*sc,-60*sc); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(30*sc,-60*sc); ctx.lineTo(100*sc,-60*sc); ctx.quadraticCurveTo(118*sc,-30*sc,100*sc,0); ctx.lineTo(30*sc,0); ctx.quadraticCurveTo(8*sc,-30*sc,30*sc,-60*sc); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0C0A08'; ctx.fillRect(-30*sc,-32*sc,60*sc,6*sc);
    // arms
    const a=hit*40*sc; ctx.strokeStyle='#050403'; ctx.lineWidth=14*sc; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-20*sc,-130*sc); ctx.lineTo(-90*sc,-70*sc+a); ctx.moveTo(20*sc,-130*sc); ctx.lineTo(90*sc,-70*sc+a*.6); ctx.stroke();
    ctx.restore(); }
  let lastBeat=-1;
  function frame(now){ if(done) return; const t=(now-t0)/1000; const W=FW,H=FH; const ac=AU.ctx; const at=ac?ac.currentTime:t;
    // beat phase from audio
    let beat=(t/BAR)%1, hit=0; if(AU.drumOn){ beat=((at-AU.nextBar)/BAR+100)%1; for(let i=beatEvents.length-1;i>=0;i--){ const e=beatEvents[i]; if(e.t<=at){ if(e.k==='kung'&&at-e.t<.12) hit=1-(at-e.t)/.12; if(e.k==='kung'&&e.t!==lastBeat){ lastBeat=e.t; scene.cam.shake=.006*scene.speed; } break; } } }
    scene.cam.shake=(scene.cam.shake||0)*.85;
    ctx.save(); ctx.clearRect(0,0,W,H);
    const z=scene.cam.z; ctx.translate(W/2+scene.cam.x*W+(Math.random()-.5)*scene.cam.shake*W,H/2+scene.cam.y*H+(Math.random()-.5)*scene.cam.shake*H); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
    SCENES.gutpan(ctx,W,H,t);

    await say('gaksi','……돌아가자.'); hideAll(); return 'dongti'; },
  async dongti(){ await setBG('home','night'); showChar('seonbi','left'); shown.seonbi.classList.add('dim'); showChar('gaksi','right');
    await say(N,'돌아온 집에서 붉은선비가 앓아누웠다.');
    await say('gaksi','열도 없고 상처도 없는데……');
    await say('seonbi','……일어나지지가 않소.');
    showChar('mudang','center'); await say('mudang','산천 동티요. 산천을 노하게 한 값이오.');
    await say('mudang','새로 지어진 산천도 빚은 기억하오. 팔도 명산에 소반을 차리시오. 산천굿을 해야 하오.');
    await say('gaksi',`……소반 ${S.mtn.length===8?'여덟':S.mtn.length+'개'}.`);
    await say(N,'그날 밤, 마당에 지전이 걸리고 장구가 놓였다.');
    await gutCinematic();
    return S.mtn.length===8?'ending:origin':'ending:half'; }
};
async function run(label){ let cur=label; while(cur){ if(cur.startsWith('ending:')){ await ending(cur.slice(7)); return; } S.label=cur; const next=await SCRIPT[cur](); cur=next; } }
