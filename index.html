<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네 번의 금기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root{
    --ink:#0E0C0A; --ink-2:#1A1612; --paper:#E8DFCB; --paper-dim:#B8AD98; --mute:#857A69; --line:#3A3229;
    --red:#B5352B; --red-soft:#D8564A; --serpent:#4F8A6E; --gold:#D3A94A; --gold-soft:#F0D48A; --night:#1B2233;
    --display:"Song Myung","Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --body:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",Georgia,serif;
    --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--paper);height:100%;overflow:hidden}
  body{font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none}
  button{font-family:inherit}

  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .frame{position:relative;width:var(--fw);height:var(--fh);font-size:calc(var(--fw) / 100);overflow:hidden;background:var(--ink)}
  .cam{position:absolute;inset:0;will-change:transform}
  canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
  #chars{position:absolute;inset:0;pointer-events:none}
  .ch{position:absolute;bottom:-1%;width:30%;height:88%;transform:translateX(-50%);transition:opacity .7s ease,transform .7s ease,filter .5s ease;opacity:0;filter:drop-shadow(0 0 .6em rgba(232,223,203,.14))}
  .ch canvas{width:100%;height:100%;display:block}
  .ch.on{opacity:1}
  .ch.speak{filter:drop-shadow(0 0 1.6em var(--rim)) drop-shadow(0 0 .3em var(--rim));transform:translateX(-50%) scale(1.025)}
  .ch.dim{opacity:.72}
  .ch.fire{filter:drop-shadow(0 0 1.4em #FF8A2A) drop-shadow(0 .6em 2em #C93A18);animation:flicker .25s steps(2) infinite}
  @keyframes flicker{50%{filter:drop-shadow(0 0 1.9em #FFB25A) drop-shadow(0 .6em 2.4em #C93A18)}}
  .ch.pos-left{left:21%} .ch.pos-center{left:50%} .ch.pos-right{left:79%} .ch.pos-tree{left:76%;bottom:33%;width:16%;height:48%}

  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
  #fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease;pointer-events:none}
  #fade.on{opacity:1}
  #flash{position:absolute;inset:0;background:#FFF3DA;opacity:0;pointer-events:none}
  #flash.go{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .cam.shake{animation:shake .5s linear}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-.6%,.3%)}40%{transform:translate(.5%,-.4%)}60%{transform:translate(-.4%,.2%)}80%{transform:translate(.3%,.3%)}}
  .bars{position:absolute;left:0;right:0;height:0;background:#000;transition:height .9s ease;z-index:6;pointer-events:none}
  .bars.top{top:0}.bars.bottom{bottom:0} .bars.on{height:11%}

  /* dialogue */
  #dlg{position:absolute;left:5%;right:5%;bottom:4%;min-height:24%;z-index:5;background:linear-gradient(180deg,rgba(26,22,18,.94),rgba(14,12,10,.97));border:1px solid rgba(211,169,74,.35);border-radius:.3em;padding:2.4em 2.6em 1.6em;cursor:pointer;opacity:0;transition:opacity .35s;box-shadow:0 1em 3em rgba(0,0,0,.6)}
  #dlg.on{opacity:1}
  #dlg::before{content:"";position:absolute;inset:.45em;border:1px solid rgba(232,223,203,.08);border-radius:.15em;pointer-events:none}
  #name{position:absolute;top:-1.35em;left:2.2em;font-family:var(--display);font-size:1.45em;letter-spacing:.12em;padding:.25em 1em .2em;background:var(--ink);border:1px solid var(--who,var(--paper-dim));color:var(--who,var(--paper));border-radius:.15em}
  #name:empty{display:none}
  #text{font-size:1.7em;line-height:1.7;color:var(--paper);text-wrap:pretty;max-width:62ch;min-height:2.2em}
  #text.narr{color:var(--paper-dim)}
  #text.q{font-family:var(--display);color:var(--red-soft)}
  #text.q.serp{color:#8FC7A9}
  #text .cur{display:inline-block;width:.5em;height:1em;background:var(--paper-dim);vertical-align:-.15em;margin-left:.1em;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #adv{position:absolute;right:2em;bottom:1em;font-family:var(--ui);font-size:1.1em;color:var(--gold);opacity:0;animation:bob 1.2s ease-in-out infinite}
  #adv.on{opacity:1}
  @keyframes bob{50%{transform:translateY(.3em)}}
  #opts{display:none;flex-direction:column;gap:.25em;margin-top:1em;border-top:1px solid rgba(232,223,203,.1);padding-top:.9em}
  #opts.on{display:flex}
  .opt{display:grid;grid-template-columns:1.6em 1fr auto;align-items:baseline;gap:.4em;font-size:1.55em;padding:.32em .6em;border-radius:.15em;color:var(--paper-dim);cursor:pointer;border:1px solid transparent}
  .opt .mk{color:var(--gold);opacity:0;font-family:var(--ui)}
  .opt small{font-family:var(--ui);font-size:.6em;color:var(--mute);letter-spacing:.06em}
  .opt.sel{color:var(--paper);background:rgba(232,223,203,.06);border-color:rgba(211,169,74,.35)}
  .opt.sel .mk{opacity:1}
  .opt.break.sel{border-color:rgba(181,53,43,.6)} .opt.break small{color:var(--red-soft)}
  #hint{position:absolute;right:2.2em;top:-1.2em;font-family:var(--ui);font-size:.95em;color:var(--mute);letter-spacing:.08em;background:var(--ink);padding:.1em .6em;border:1px solid var(--line);display:none}
  #hint.on{display:block}

  /* HUD */
  #hud{position:absolute;top:2.2%;right:3%;z-index:5}
  .tool{font-family:var(--ui);font-size:1.05em;letter-spacing:.08em;color:var(--paper-dim);background:rgba(14,12,10,.7);border:1px solid var(--line);border-radius:.2em;padding:.45em .9em;cursor:pointer}
  .tool:hover{color:var(--paper);border-color:var(--paper-dim)}
  .tool[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
  .tool:focus-visible,.big:focus-visible,.mtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tools{position:relative;display:flex;flex-direction:column;align-items:flex-end}
  .gear{width:3.2em;height:3.2em;padding:0;display:grid;place-items:center;border-radius:50%}
  .gear[aria-expanded="true"]{color:var(--gold);border-color:var(--gold)}
  .gear svg{transition:transform .5s ease} .gear[aria-expanded="true"] svg{transform:rotate(60deg)}
  .menu-dd{margin-top:.5em;display:flex;flex-direction:column;gap:.35em;min-width:12em;padding:.5em;background:rgba(14,12,10,.92);border:1px solid var(--line);border-radius:.25em;box-shadow:0 .8em 2em rgba(0,0,0,.6);animation:rise .18s ease both}
  .menu-dd[hidden]{display:none}
  .menu-dd .tool{background:transparent;border-color:transparent;display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.5em .8em}
  .menu-dd .tool:hover{border-color:var(--line);background:rgba(232,223,203,.05)}
  .menu-dd .tool i{width:.6em;height:.6em;border-radius:50%;border:1px solid var(--mute)}
  .menu-dd .tool[aria-pressed="true"] i{background:var(--gold);border-color:var(--gold)}
  @keyframes rise{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}

  /* overlays */
  .ov{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(6,5,4,.55);padding:4%}
  .ov[hidden]{display:none}
  .panel{background:rgba(26,22,18,.97);border:1px solid rgba(211,169,74,.35);border-radius:.2em;padding:2em 2.6em;width:min(72%,68em);max-height:100%;overflow:auto;box-shadow:0 1em 3em rgba(0,0,0,.6)}
  .panel h3{font-family:var(--display);font-weight:400;font-size:2.4em;margin:0 0 .3em;line-height:1.2}
  .panel h4{font-family:var(--ui);font-size:1em;letter-spacing:.2em;color:var(--mute);font-weight:500;margin:1.6em 0 .5em}
  .panel p{font-size:1.3em;line-height:1.7;margin:0 0 .7em}
  .panel a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line)}
  .big{font-family:var(--ui);font-size:1.25em;letter-spacing:.1em;color:var(--ink);background:var(--paper);border:0;border-radius:.15em;padding:.7em 1.6em;cursor:pointer}
  .big:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:.8em;flex-wrap:wrap;margin-top:1.4em;align-items:center}

  #title{background:transparent;align-items:end;justify-items:start;padding:6% 8%}
  #title .t{display:grid;gap:.4em}
  #title .eyebrow{font-family:var(--ui);font-size:1.1em;letter-spacing:.32em;color:var(--paper-dim)}
  #title h1{font-family:var(--display);font-weight:400;font-size:7.5em;line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 .1em 1em rgba(0,0,0,.8)}
  #title h1 b{font-weight:400;color:var(--red-soft)}
  #title .sub{font-size:1.5em;color:var(--paper-dim);margin-bottom:1em}
  #title .menu{display:flex;gap:.8em;flex-wrap:wrap}
  #title .foot{position:absolute;right:4%;bottom:5%;font-family:var(--ui);font-size:1em;color:var(--mute);letter-spacing:.1em;text-align:right;line-height:1.7}

  .bead{display:grid;grid-template-columns:14em 1fr;gap:2em;align-items:center}
  .bead svg{width:14em;height:14em}
  .facet{fill:#2A241D;stroke:var(--line);stroke-width:1;transition:fill .6s,stroke .6s}
  .facet.on{fill:var(--gold);stroke:var(--gold-soft);filter:drop-shadow(0 0 .3em var(--gold))}
  .facet.missing{fill:transparent;stroke:var(--gold);stroke-dasharray:3 3}
  .facet.hid{fill:var(--ink);stroke:var(--serpent)}
  .facets{list-style:none;margin:0;padding:0;font-family:var(--ui);font-size:1.2em;line-height:1.8;color:var(--paper-dim)}
  .facets li{display:grid;grid-template-columns:1.6em 1fr;gap:.6em;opacity:0;animation:rise .5s ease both}
  .facets li b{color:var(--gold);font-weight:500}
  .facets li.miss{color:var(--mute)} .facets li.miss b{color:var(--mute)}

  .map{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em;margin:1em 0 1.4em}
  .mtn{border:1px solid var(--line);border-radius:.15em;background:rgba(14,12,10,.8);color:var(--paper-dim);padding:1em .5em .8em;cursor:pointer;display:grid;gap:.1em;justify-items:center;font-family:var(--display);font-size:1.5em;transition:all .4s}
  .mtn small{font-family:var(--ui);font-size:.6em;letter-spacing:.08em;color:var(--mute)}
  .mtn:hover:not(:disabled){border-color:var(--paper-dim)}
  .mtn.lit{background:var(--gold);color:var(--ink);border-color:var(--gold-soft);box-shadow:0 0 1.2em rgba(211,169,74,.6)} .mtn.lit small{color:var(--ink)}
  .mtn:disabled{cursor:default} .mtn.dead{opacity:.3}
  .meter{font-family:var(--ui);font-size:1.2em;color:var(--mute);display:flex;justify-content:space-between} .meter b{color:var(--gold);font-weight:500}

  .end-tag{font-family:var(--ui);font-size:1.1em;letter-spacing:.3em;color:var(--red-soft);margin:0 0 .6em} .end-tag.true{color:var(--gold)} .end-tag.sky{color:#BFD8FF}
  .end-name{font-family:var(--display);font-size:4.2em;line-height:1.1;margin:0 0 .25em}
  .cond{font-family:var(--ui);font-size:1.15em;color:var(--mute);border:1px solid var(--line);padding:.9em 1.1em;line-height:1.7;margin:1.2em 0} .cond b{color:var(--paper-dim);font-weight:500}
  .codex{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:1.2em 0}
  .codex div{border:1px solid var(--line);padding:.7em .9em;font-family:var(--ui);font-size:1em;color:var(--mute);display:grid;gap:.1em}
  .codex div span{font-family:var(--display);font-size:1.4em;color:var(--paper-dim)}
  .codex .got{border-color:var(--paper-dim)} .codex .got span{color:var(--paper)}
  .codex .got.true{border-color:var(--gold)} .codex .got.true span{color:var(--gold)}
  .log{font-size:1.3em;line-height:1.7;display:grid;gap:.5em}
  .log div b{font-family:var(--display);font-weight:400;color:var(--gold);margin-right:.6em}
  .log div.narr{color:var(--paper-dim)}

  #cine{position:absolute;inset:0;z-index:7;display:none} #cine.on{display:block}
  #sub{position:absolute;left:8%;right:8%;bottom:2.4%;z-index:7;text-align:center;font-family:var(--display);font-size:2.3em;line-height:1.5;color:var(--paper);text-shadow:0 .1em 1em #000,0 0 .3em #000;opacity:0;transition:opacity .5s;pointer-events:none}
  #sub.on{opacity:1}
  #cineTitle{position:absolute;inset:0;z-index:7;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #cineTitle.on{opacity:1}
  #cineTitle h2{font-family:var(--display);font-weight:400;font-size:6em;margin:0;letter-spacing:.2em;color:var(--paper)}
  #cineTitle p{font-family:var(--ui);font-size:1.2em;letter-spacing:.4em;color:var(--paper-dim);margin:.6em 0 0}
  #skip{position:absolute;right:3%;top:13%;z-index:9;display:none} #skip.on{display:block}
  @media (prefers-reduced-motion:reduce){ #adv,.ch.fire{animation:none} }
</style>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="cam" id="cam">
      <canvas class="layer" id="bg"></canvas>
      <div id="chars"></div>
      <div id="vig"></div>
      <canvas class="layer" id="grain"></canvas>
      <canvas class="layer" id="cine"></canvas>
    </div>
    <div id="flash"></div>
    <div id="fade" class="on"></div>
    <div class="bars top" id="barT"></div><div class="bars bottom" id="barB"></div>
    <div id="cineTitle"><div><h2 id="cineH">산천굿</h2><p id="cineP"></p></div></div>
    <div id="sub"></div>
    <button class="tool" id="skip">건너뛰기 ⏭</button>

    <div id="hud">
      <div class="tools">
        <button class="tool gear" id="btnGear" aria-expanded="false" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" width="1.4em" height="1.4em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu-dd" id="menu" hidden>
          <button class="tool" id="btnAuto" aria-pressed="false"><span>자동 진행</span><i></i></button>
          <button class="tool" id="btnSound" aria-pressed="true"><span>소리</span><i></i></button>
          <button class="tool" id="btnLog"><span>기록</span></button>
          <button class="tool" id="btnLore"><span>원전과 해석</span></button>
          <button class="tool" id="btnHome"><span>처음으로</span></button>
        </div>
      </div>
    </div>

    <div id="dlg"><div id="name"></div><div id="hint">↑↓ 고르고 Enter</div><div id="text"></div><div id="opts"></div><div id="adv">▼</div></div>

    <div class="ov" id="panelOv" hidden><div class="panel" id="panel"></div></div>

    <div class="ov" id="title">
      <div class="t">
        <div class="eyebrow">함경도 망묵굿 · 산천굿 사설 · 인터랙티브 픽션</div>
        <h1>네 번의 <b>금기</b></h1>
        <div class="sub">붉은선비와 영산각시</div>
        <div class="menu">
          <button class="big" id="btnStart">시작하기</button>
          <button class="tool" id="btnCodex">결말 도감</button>
          <button class="tool" id="btnLore2">원전과 해석</button>
        </div>
      </div>
      <div class="foot">설화문학론 · 설화의 콘텐츠 재생산<br>클릭 / Space 로 진행 · ↑↓ 로 고르고 Enter · 소리를 켜고 플레이하세요</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const n1=(x,s=0)=>(Math.sin(x*1.7+s)+Math.sin(x*3.1+s*2.3)*.5+Math.sin(x*6.7+s*4.1)*.25)/1.75;
function rng(seed){ let s=seed>>>0||1; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }

/* ================= frame ================= */
const frame=$('#frame'); let FW=1280, FH=720;
const bgC=$('#bg'), grainC=$('#grain'), cineC=$('#cine'); const bg=bgC.getContext('2d'), cine=cineC.getContext('2d');
function fit(){ const vw=innerWidth, vh=innerHeight; let w=vw, h=vw*9/16; if(h>vh){h=vh; w=vh*16/9;} FW=Math.floor(w); FH=Math.floor(h);
  frame.style.setProperty('--fw',FW+'px'); frame.style.setProperty('--fh',FH+'px');
  [bgC,grainC,cineC].forEach(c=>{ const d=Math.min(devicePixelRatio||1,2); c.width=Math.round(FW*d); c.height=Math.round(FH*d); c.getContext('2d').setTransform(d,0,0,d,0,0); });
  drawGrain(); Object.values(shown).forEach(sizeChar); }
addEventListener('resize',fit);
function drawGrain(){ const g=grainC.getContext('2d'); const w=grainC.width,h=grainC.height; const img=g.createImageData(w,h); const d=img.data; const r=rng(7); for(let i=0;i<d.length;i+=4){ const v=(r()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } g.setTransform(1,0,0,1,0,0); g.putImageData(img,0,0); }

/* ================= state ================= */
let S=fresh();
function fresh(){ return {broken:[],kept:[],role:'붉은선비',mtn:[],ash:0,pyre:0,ending:null}; }
let codex=[]; try{codex=JSON.parse(localStorage.getItem('sancheon-codex')||'[]');}catch(e){}
function saveCodex(){ try{localStorage.setItem('sancheon-codex',JSON.stringify(codex));}catch(e){} }
const log=[];

/* ================= audio ================= */
const AU={ctx:null,on:true,master:null,ambGain:null,drumTimer:null,nextBar:0,drumOn:false};
function audio(){ if(AU.ctx) return AU.ctx; try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.on?0.9:0; AU.master.connect(AU.ctx.destination);
  AU.ambGain=AU.ctx.createGain(); AU.ambGain.gain.value=0; AU.ambGain.connect(AU.master); return AU.ctx; }
function noiseBuf(ctx,sec=2){ const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
let ambNodes=[];
function ambient(kind){ const ctx=audio(); if(!ctx) return; ambNodes.forEach(n=>{try{n.stop()}catch(e){}}); ambNodes=[];
  AU.ambGain.gain.cancelScheduledValues(ctx.currentTime); AU.ambGain.gain.setTargetAtTime(0,ctx.currentTime,.4); if(!kind) return;

const ENDINGS={
  origin:{name:'산천굿의 기원',tag:'참된 결말',trueEnd:true,cond:'네 금기를 모두 어기고, 각시가 대신 가서, 칼을 꺼내고, 마지막 모를 던지고, 팔도에 재를 다 뿌린다.',text:['붉은선비의 병이 나았다. 그 뒤로 산천 동티가 나면 사람들은 팔도 명산에 소반을 차리고 산천굿을 했다.','함흥의 망묵굿에서 무당은 장구 하나로 이 이야기를 부른다. 네 금기를 모두 어긴 선비, 칼을 품고 나선 각시, 재로 지어진 산천.','금기를 하나라도 지켰다면 이 산천은 없었다. 이야기는 위반을 먹고 자란다.']},

function lore(){ return panel(`<h3>원전과 해석</h3><p style="font-family:var(--ui);font-size:1em;color:var(--mute)">설화문학론 · 설화의 콘텐츠 재생산 과제 · 인터랙티브 픽션</p>
<h4>원전</h4><p>함경남도 함흥 지방 망묵굿(죽은 이를 위한 굿)의 한 거리인 <b>산천굿</b>에서 무당이 홀로 장구를 치며 부르는 무가 「붉은선비와 영산각시」. 팔도의 명산대천에 기도하여 망자의 사후 안주와 유족의 길복을 비는 거리이며, 함흥 밖에서는 조사된 바가 없다. 이 게임은 한국민족문화대백과사전 항목과 무녀 김복순 구연본 소개(조현설)를 함께 따랐다.</p>
<h4>원전의 뼈대</h4><p>글공부하던 붉은선비가 귀가하는 길에 스승의 경고 — 맑은 물을 마시지 말 것, 머루·다래를 따 먹지 말 것, 폭우를 피하지 말 것, 천년고목의 불을 끄지 말 것 — 를 모두 어긴다. 불을 끄자 선녀가 나타나 <b>대맹이</b>(큰 구렁이)로 변하여 잡아먹으려 한다. 대맹이는 죄를 짓고 쫓겨난 천상의 선녀로, 맑은 물과 과일을 먹고 승천하려던 것을 방해받았다고 한다. 붉은선비는 부모를 뵙고 돌아와 잡아먹히기로 약속하고 집에 온다. 영산각시가 대맹이를 찾아가 "남편 없이 살 길"을 청하자 대맹이는 무엇이든 원하는 대로 해 주는 구슬을 준다. 각시가 그 구슬로 "너 죽어라" 하니 대맹이가 죽고, 그 재를 팔도에 뿌려 백두산·금강산·삼각산 등 명산을 만든다. 산천굿에서는 여덟 소반을 차리는데 팔도 명산에 바치는 것이며, 영혼이 극락에 가도 뼈는 명산에 묻혀야 한다는 사설이 따른다.</p>
<h4>이 게임이 바꾼 것</h4><p>원전에서 선택은 없다. 붉은선비는 반드시 네 금기를 모두 어기고, 그래야만 대맹이가 죽고 산천이 만들어진다. 게임은 그 "반드시"를 독자에게 넘긴다. 금기를 지킬수록 대맹이는 작아지고, 재는 모자라고, 팔도의 산은 비어 간다. 금기를 모두 지키면 대맹이는 잃은 것이 없으므로 본래의 선녀로 돌아가 승천하고, 굿은 생기지 않는다. 영산각시 파트는 시점을 바꿔 두었고, 팔모야광주(김복순 구연본)의 여섯째 모는 구연에서 빠져 있어 빈 모로 남겼다.</p>
<h4>연출에 대하여</h4><p>인물은 그림자극의 실루엣으로, 배경은 코드로 그린 산수로 두었다. 장구 굿거리 장단·징·방울은 웹오디오로 합성했고, 무가 사설 낭송은 브라우저의 한국어 음성 합성을 쓴다. 실제 무당의 구연 녹음이 아니며, 함흥 산천굿의 실제 절차를 고증한 것도 아니다.</p>
<h4>참고</h4><p>한국민족문화대백과사전 「산천굿」 (<a href="https://encykorea.aks.ac.kr/Article/E0026342" target="_blank" rel="noopener">항목</a>) · 조현설, 「자연의 금기 깬 남편 대신 해결 나선 영산 각시, 산천을 바로잡다」, 경향신문 2018-07-12 (<a href="https://www.khan.co.kr/article/201807122058005" target="_blank" rel="noopener">기사</a>)</p><div class="row"><button class="big" id="pnClose">닫기</button></div>`); }

/* ================= cinematic runner ================= */
function runCine(spec){ return new Promise(async res=>{
  GUT.playing=true; hideAll(); dlg.classList.remove('on'); $('#hud').style.opacity=0; $('#skip').classList.add('on'); $('#barT').classList.add('on'); $('#barB').classList.add('on');
  const ctx=cine, timers=[]; let done=false, raf=0, t0=performance.now(); const sub=$('#sub'), title=$('#cineTitle'); const st={cam:{z:1,x:0,y:0,shake:0},flashA:0};
  const wait=ms=>new Promise(r=>{ const id=setTimeout(r,ms); timers.push(id); });
  const line=(txt,ms,opts)=>{ sub.textContent=txt; sub.classList.add('on'); speak(txt,opts); return wait(ms); };
  const every=(fn,ms)=>{ const id=setInterval(fn,ms); timers.push(id); return id; };
  function end(){ if(done) return; done=true; timers.forEach(id=>{ clearTimeout(id); clearInterval(id); }); cancelAnimationFrame(raf); if(window.speechSynthesis) speechSynthesis.cancel(); drumStop(); sub.classList.remove('on'); title.classList.remove('on'); cineC.classList.remove('on'); $('#skip').classList.remove('on'); $('#barT').classList.remove('on'); $('#barB').classList.remove('on'); $('#hud').style.opacity=1; GUT.playing=false; GUT.skipFn=null; res(); }
  GUT.skipFn=async()=>{ await fadeTo(true); end(); await fadeTo(false); }; $('#skip').onclick=GUT.skip;
  function frame(now){ if(done) return; const t=(now-t0)/1000; const W=FW,H=FH; st.cam.shake*=.85; ctx.save(); ctx.clearRect(0,0,W,H); const z=st.cam.z; ctx.translate(W/2+st.cam.x*W+(Math.random()-.5)*st.cam.shake*W,H/2+st.cam.y*H+(Math.random()-.5)*st.cam.shake*H); ctx.scale(z,z); ctx.translate(-W/2,-H/2); try{ spec.draw(ctx,W,H,t,st); }catch(e){ console.error(e); } ctx.restore(); if(st.flashA>0){ ctx.fillStyle=`rgba(255,243,218,${st.flashA})`; ctx.fillRect(0,0,W,H); st.flashA*=.88; } raf=requestAnimationFrame(frame); }
  cineC.classList.add('on'); await fadeTo(true); if(spec.amb!==undefined) ambient(spec.amb); raf=requestAnimationFrame(frame); await fadeTo(false);
  if(spec.title){ $('#cineH').textContent=spec.title; $('#cineP').textContent=spec.sub||''; title.classList.add('on'); await wait(2400); title.classList.remove('on'); await wait(700); }
  if(done) return; try{ await spec.run({line,wait,every,st,done:()=>done}); }catch(e){ console.error(e); }
  if(done) return; sub.classList.remove('on'); await wait(500); await fadeTo(true); end(); await fadeTo(false);
}); }

function gutSpec(){ const total=S.mtn.length; GUT.candles=0; GUT.mtnLit=0; GUT.wind=.4; GUT.ember=.2; let lastBeat=-1; const sc={spin:0,speed:1,healed:0,phase:'title'};
  function drawMudang(ctx,x,base,s,t,beat){ const sp=sc.speed, sway=Math.sin(beat*Math.PI)*0.14*sp, bob=Math.abs(Math.sin(beat*Math.PI*2))*9*s*sp; const flip=Math.cos(sc.spin);
    ctx.save(); ctx.translate(x,base-bob); ctx.rotate(sway*.3); ctx.scale(Math.max(.22,Math.abs(flip))*(flip<0?-1:1),1); ctx.translate(-x,-(base-bob));
    const wr=[[150-150+Math.cos(t*2.3)*12, 178+40+Math.sin(beat*Math.PI*2)*40],[150+150+Math.sin(t*2)*12, 178-120-Math.sin(beat*Math.PI*2+1)*60]];

    ctx.beginPath(); ctx.moveTo(-100*s,-60*s); ctx.lineTo(-30*s,-60*s); ctx.quadraticCurveTo(-8*s,-30*s,-30*s,0); ctx.lineTo(-100*s,0); ctx.quadraticCurveTo(-118*s,-30*s,-100*s,-60*s); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(30*s,-60*s); ctx.lineTo(100*s,-60*s); ctx.quadraticCurveTo(118*s,-30*s,100*s,0); ctx.lineTo(30*s,0); ctx.quadraticCurveTo(8*s,-30*s,30*s,-60*s); ctx.closePath(); ctx.fill(); ctx.fillStyle='#0C0A08'; ctx.fillRect(-30*s,-32*s,60*s,6*s);
    const a=hit*40*s; ctx.strokeStyle='#050403'; ctx.lineWidth=14*s; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-20*s,-130*s); ctx.lineTo(-90*s,-70*s+a); ctx.moveTo(20*s,-130*s); ctx.lineTo(90*s,-70*s+a*.6); ctx.stroke(); ctx.restore(); }
  return { title:'산천굿', sub:'山川굿 · 함흥 망묵굿 · 팔도 명산에 비는 거리', amb:'night',
    draw(ctx,W,H,t,st){ const ac=AU.ctx; const at=ac?ac.currentTime:t; let beat=(t/BAR)%1, hit=0; if(AU.drumOn){ beat=((at-AU.nextBar)/BAR+100)%1; for(let i=beatEvents.length-1;i>=0;i--){ const e=beatEvents[i]; if(e.t<=at){ if(e.k==='kung'&&at-e.t<.12) hit=1-(at-e.t)/.12; if(e.k==='kung'&&e.t!==lastBeat){ lastBeat=e.t; st.cam.shake=.006*sc.speed; } break; } } }
      SCENES.gutpan(ctx,W,H,t); if(sc.phase!=='title'){ drawAksa(ctx,W*.13,H*.9,H/720*.8,t,hit); drawMudang(ctx,W*.6,H*.95,H/720*.64,t,beat); }
      if(sc.healed>0){ drawFigure(ctx,'seonbi',{x:W*.88,base:H*.9,h:H*.62,t,pose:'stand',alpha:sc.healed,lean:-(1-sc.healed)*1.2,glow:'rgba(216,86,74,.5)'}); } },
    async run({line,every,st,done}){ sc.phase='play'; st.cam.z=1.08; drumStart(); SFX.jing(); st.flashA=.5; GUT.wind=.7; GUT.ember=.5;
      await line('팔도 명산 대천에 비나이다.',3600,{rate:.7}); if(done()) return; const names=['함경도 백두산 신령님','평안도 모란봉 신령님','강원도 금강산 신령님','경기도 삼각산 신령님','황해도 구월산 신령님','전라도 지리산 신령님','충청도 계룡산 신령님','경상도 태백산 신령님'];

    await say(N,'각시는 야광주를 손바닥에 올렸다. 여덟째 모가 다른 모보다 조금 차가웠다.');
    await choice([{t:'대맹이를 겨누어 던진다',sub:'"너 죽어라."',v:1}]);
    fx('flash'); SFX.boom(); fx('shake'); serpentDead=true; SFX.hiss();
    await say(N,'대맹이는 승천하지 못하고 죽었다. 천 년이 그 자리에서 끝났다.');
    hideAll(); return 'pyre'; },
  async pyre(){ await setBG('pyre','night'); serpentDead=false; serpentLevel=0; showChar('gaksi','left');
    await say(N,'영산각시는 시신을 그냥 두지 않았다. 나뭇가지를 꺾어 우물 정(井) 자로 쌓기 시작했다. 삼천 개였다.');
    await pyreUI(); fx('flash');
    await say(N,'불은 밤새 탔다. 천 년 묵은 것은 타는 데도 오래 걸렸다.');
    hideAll(); return 'ash'; },
  async ash(){ await setBG('palto','wind'); S.ash=S.broken.length*2; showChar('gaksi','left');
    await say(N,`불이 사그라지고 재가 남았다. 영산각시는 재를 봉지에 나누어 담았다. 봉지는 ${S.ash}개였다.`);
    await say(N, S.ash<8?'대맹이가 작았던 만큼 재도 적었다.':'대맹이가 컸던 만큼 재도 넉넉했다.');
    await say('gaksi','한 봉지에 산 하나.');
    await ashUI();
    if(S.mtn.length===8){ await say(N,'팔도의 산에 모두 신령이 앉았다. 재는 아직 남아 있었다.'); await say(N,'남은 재를 사오방에 뿌리자 사오방의 큰 신령이 되었다. 나무에 뿌리니 꽃의 신령이, 돌에 뿌리니 돌의 신령이 되었다. 마지막으로 물에 뿌리자 온갖 짐승이 되어 흩어졌다.'); await say(N,'대맹이 하나가 죽어 산천이 되었다.'); }
    else { await say(N,'재는 거기서 바닥났다. 나머지 산에는 아무도 앉지 않았다.'); await say(N,'나무에도, 돌에도, 물에도 뿌릴 재가 없었다.'); }
    await say('gaksi','……가자.'); hideAll(); return 'dongti'; },
  async dongti(){ await setBG('home','night'); showChar('seonbi','left'); shown.seonbi.classList.add('dim'); showChar('gaksi','right');
    await say(N,'집에 돌아온 뒤, 붉은선비가 앓아누웠다.');
    await say('gaksi','열도 없고 다친 데도 없는데…… 왜 못 일어나요.');
    await say('seonbi','……모르겠소. 몸이 땅에 붙은 것 같소.');
    showChar('mudang','center'); await say('mudang','산천 동티요. 산천을 노하게 한 값을 치르는 거요.');
    await say('mudang','새로 생긴 산천이라도 빚은 기억하오. 팔도 명산에 소반을 차리시오. 산천굿을 해야 낫소.');
    await say('gaksi',`……소반 ${S.mtn.length===8?'여덟':S.mtn.length+'개'}.`);
    await say(N,'그날 밤, 마당에 지전이 걸리고 장구가 놓였다.');
    hideAll(); return S.mtn.length===8?'ending:origin':'ending:half'; }
};
async function run(label){ let cur=label; while(cur){ if(cur.startsWith('ending:')){ await ending(cur.slice(7)); return; } const next=await SCRIPT[cur](); cur=next; } }

/* ================= boot ================= */
let bgT0=performance.now();
function loop(now){ const t=(now-bgT0)/1000; drawBG(t); drawChars(t); requestAnimationFrame(loop); }
function goTitle(){ S=fresh(); hideAll(); dlg.classList.remove('on'); optState=null; optsEl.classList.remove('on'); serpentLevel=0; serpentDead=false; flameOn=false; BGS.cur='tree'; $('#title').hidden=false; $('#fade').classList.remove('on'); ambient(null); drumStop(); }
$('#btnStart').onclick=async()=>{ audio(); if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume(); $('#title').hidden=true; SFX.jing(); $('#fade').classList.add('on'); await new Promise(r=>setTimeout(r,700)); run('prologue'); };
$('#btnCodex').onclick=()=>panel(`<h3>결말 도감</h3>${codexHTML()}<div class="row"><button class="big" id="pnClose">닫기</button></div>`);
$('#btnLore2').onclick=lore; $('#btnLore').onclick=lore;
$('#btnHome').onclick=()=>{ if(GUT.playing) GUT.skip(); closePanel(); goTitle(); };
$('#btnLog').onclick=()=>panel(`<h3>기록</h3><div class="log">${log.slice(-40).map(l=>`<div class="${l.narr?'narr':''}"><b>${l.who}</b>${l.t}</div>`).join('')||'<p>아직 기록이 없다.</p>'}</div><div class="row"><button class="big" id="pnClose">닫기</button></div>`);
$('#btnAuto').onclick=function(){ autoMode=!autoMode; this.setAttribute('aria-pressed',autoMode); if(autoMode&&waiting&&!typing){ autoTimer=setTimeout(()=>waiting&&waiting(),800); } };
$('#btnSound').onclick=toggleSound;
const menu=$('#menu'), gear=$('#btnGear'); function setMenu(open){ menu.hidden=!open; gear.setAttribute('aria-expanded',open); }
gear.onclick=e=>{ e.stopPropagation(); setMenu(menu.hidden); }; menu.addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('button'); if(b&&b.id!=='btnAuto'&&b.id!=='btnSound') setMenu(false); }); document.addEventListener('click',()=>setMenu(false)); document.addEventListener('keydown',e=>{ if(e.key==='Escape') setMenu(false); });
fit(); goTitle(); requestAnimationFrame(loop);
window.claude?.hot?.snapshot?.(()=>({codex}));
})();
